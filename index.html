<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة TIMSS 2027 | تسجيل الدخول</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ============================================================
   تخصيص صفحة الدخول — تناسب شاشة واحدة دون سكرول
   ============================================================ */
body{overflow-y:auto;}

main{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:12px 14px;
  margin:0 auto;
}

/* رأس الصفحة مضغوط */
header{padding:12px 4%;}
.logo{font-size:19px;}
header .sub{font-size:11px;}

/* إهداء مضغوط — سطر واحد أو سطرين */
.dedication-box{
  padding:10px 16px;
  margin-bottom:12px;
  text-align:center;
}
.dedication-box h3{font-size:14px;margin:0 0 3px;}
.dedication-box p{font-size:12px;margin:2px 0;}
.dedication-box .name{font-size:14px;display:inline;}
.dedication-box .btn-whatsapp{
  padding:5px 12px;
  font-size:12px;
  margin-top:6px;
  margin-right:8px;
}

/* صندوق الدخول مضغوط */
.login-box{margin:0 auto;max-width:420px;width:100%;}
.login-box .panel{padding:18px 20px;}
.login-box h2{font-size:18px;margin-bottom:6px;}
.login-box .muted{font-size:12px;margin-bottom:14px;}

.login-box .field{margin:10px 0;}
.login-box input{padding:10px 12px;font-size:14px;}

.login-box .actions{margin-top:16px;}

/* الفوتر مضغوط */
footer{padding:8px;font-size:10px;}

/* على الشاشات القصيرة جداً — اسمح بالسكرول */
@media (max-height:600px){
  .dedication-box{padding:8px 12px;}
  .login-box .panel{padding:14px 18px;}
  .login-box .field{margin:7px 0;}
}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">منصة تدريب TIMSS 2027</div>
    <div class="sub">بوابة المستخدمين</div>
  </div>
  <div class="sub">تسجيل الدخول</div>
</header>

<main>
  <!-- إهداء مضغوط -->
  <div class="dedication-box">
    <h3>🎓 إهداء</h3>
    <p>إلى مديرية التربية والتعليم لمنطقة الزرقاء الثانية — <span class="name">الأستاذ: عواد دحبور</span></p>
    <a href="https://wa.me/962788107669" target="_blank" class="btn-whatsapp">📞 +962 788107669 (واتساب)</a>

  </div>

  <!-- نموذج الدخول -->
  <section class="panel login-box" id="loginPanel">
    <h2>تسجيل الدخول</h2>
    <p class="muted">
     
    </p>

    <label class="field">
      الرقم الوطني
      <input id="username" type="text" autocomplete="off" inputmode="numeric" placeholder="">
    </label>

    <label class="field">
      الرقم الوطني للمنشأة
      <input id="password" type="text" autocomplete="off" inputmode="numeric" placeholder="">
    </label>

    <div class="actions" style="justify-content:center">
      <button class="primary" id="loginBtn" style="width:100%">دخول النظام</button>
    </div>

    <div id="loginMessage" class="hidden" style="margin-top:12px" role="status"></div>
  </section>
</main>

<footer>منصة تدريبية مستقلة مستلهمة من إطار TIMSS.</footer>

<!-- المكتبات والملفات المشتركة -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>

<script>
'use strict';
const $ = id => document.getElementById(id);

// التحقق من تحميل العميل
if (!window.db) {
  console.error('❌ window.db غير معرّف — تحقق من supabase-client.js');
  alert('خطأ في الاتصال بالخدمة. تأكد من وجود ملف supabase-client.js في نفس المجلد.\nثم أعد تحميل الصفحة.');
}

// إذا كان المستخدم مسجل الدخول بالفعل → وجّهه لصفحته مباشرة
redirectIfLoggedIn();

// ------------------------------------------------------------
// أدوات الرسائل
// ------------------------------------------------------------
function setMessage(text, kind) {
  const box = $('loginMessage');
  box.className = kind || 'warning';
  box.textContent = text;
  box.classList.remove('hidden');
}
function clearMessage() {
  $('loginMessage').classList.add('hidden');
}

// ------------------------------------------------------------
// تسجيل الدخول
// ------------------------------------------------------------
async function doLogin() {
  const username = $('username').value.trim();
  const password = $('password').value.trim();
  const btn = $('loginBtn');

  clearMessage();

  if (!username || !password) {
    setMessage('⚠️ الرجاء إدخال الرقم الوطني ورقم المنشأة', 'error');
    $('username').focus();
    return;
  }

  const code = parseInt(password, 10);
  if (isNaN(code)) {
    setMessage('⚠️ رقم المنشأة يجب أن يكون رقماً', 'error');
    $('password').focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ جارٍ التحقق...';
  setMessage('جارٍ التحقق من بيانات الدخول...', 'warning');

  try {
    // 1) البحث في جدول الطلاب
    const rStudent = await window.db
      .from('students')
      .select('*, schools (school_name)')
      .eq('national_id', username)
      .eq('school_id', code)
      .maybeSingle();

    if (rStudent.error) console.warn('students lookup:', rStudent.error);

    if (rStudent.data) {
      saveSession('student', rStudent.data);
      window.location.replace(getRoleHome('student'));
      return;
    }

    // 2) البحث في جدول المعلمين
    const rTeacher = await window.db
      .from('teachers')
      .select('*, schools (school_name)')
      .eq('national_id', username)
      .eq('school_id', code)
      .maybeSingle();

    if (rTeacher.error) console.warn('teachers lookup:', rTeacher.error);

    if (rTeacher.data) {
      saveSession('teacher', rTeacher.data);
      window.location.replace(getRoleHome('teacher'));
      return;
    }

    // 3) البحث في جدول المشرفين
    const rSupervisor = await window.db
      .from('supervisors')
      .select('*, directorates (directorate_name)')
      .eq('national_id', username)
      .eq('directorate_id', code)
      .maybeSingle();

    if (rSupervisor.error) console.warn('supervisors lookup:', rSupervisor.error);

    if (rSupervisor.data) {
      saveSession('supervisor', rSupervisor.data);
      window.location.replace(getRoleHome('supervisor'));
      return;
    }

    // لم يتم العثور على أي تطابق
    setMessage('❌ بيانات الدخول غير صحيحة. تحقق من الرقم الوطني ورقم المنشأة.', 'error');
    $('password').focus();
    $('password').select();

  } catch (err) {
    console.error('login error:', err);
    setMessage('❌ حدث خطأ: ' + (err.message || String(err)), 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'دخول النظام';
  }
}

// ------------------------------------------------------------
// الأحداث
// ------------------------------------------------------------
$('loginBtn').addEventListener('click', doLogin);

$('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
});

$('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); $('password').focus(); }
});
</script>
</body>
</html>
